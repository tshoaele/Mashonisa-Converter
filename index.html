<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1e33">
<meta name="description" content="Quick loan repayment calculator">
<title>Informal Blesser</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
  /* Apply theme before paint to avoid flash */
  (function () {
    try {
      var t = localStorage.getItem("blesser_theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>

<style>
  /* ---------- Theme tokens ---------- */
  :root {
    --bg-1: #f8fafc;
    --bg-2: #e2e8f0;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --border: #e2e8f0;
    --border-soft: rgba(11, 30, 51, 0.04);
    --text: #0b1e33;
    --text-dim: #64748b;
    --text-mute: #94a3b8;
    --accent: #3b82f6;
    --accent-deep: #1d4ed8;
    --shadow-card: 0 4px 20px -4px rgba(11, 30, 51, 0.08);
    --shadow-pill: 0 2px 6px rgba(11, 30, 51, 0.05);
    --toggle-bg: #e2e8f0;
    --toggle-active: #ffffff;
    --menu-bg: #ffffff;
    --menu-option-bg: #f8fafc;
    --menu-option-text: #0b1e33;
    --menu-option-hover: #e0ecff;
    --menu-option-active-bg: #0b1e33;
    --menu-option-active-text: #ffffff;
    --modal-overlay: rgba(11, 30, 51, 0.5);
    --output-bg-1: #0b1e33;
    --output-bg-2: #1e3a5f;
    --output-text: #ffffff;
    --output-label: #8aa3c0;
    --output-currency: #60a5fa;
  }

  [data-theme="dark"] {
    --bg-1: #0b1e33;
    --bg-2: #050d18;
    --surface: #12263f;
    --surface-soft: #0f2035;
    --border: #1e3a5f;
    --border-soft: rgba(255, 255, 255, 0.05);
    --text: #e6f0ff;
    --text-dim: #8aa3c0;
    --text-mute: #64748b;
    --accent: #60a5fa;
    --accent-deep: #3b82f6;
    --shadow-card: 0 4px 20px -4px rgba(0, 0, 0, 0.4);
    --shadow-pill: 0 2px 6px rgba(0, 0, 0, 0.3);
    --toggle-bg: #0f2035;
    --toggle-active: #1e3a5f;
    --menu-bg: #12263f;
    --menu-option-bg: #0f2035;
    --menu-option-text: #e6f0ff;
    --menu-option-hover: #1e3a5f;
    --menu-option-active-bg: #3b82f6;
    --menu-option-active-text: #ffffff;
    --modal-overlay: rgba(0, 0, 0, 0.7);
  }

  /* ---------- Reset & base ---------- */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
    overflow-x: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* ---------- Layout ---------- */
  .app {
    width: 100%;
    max-width: 480px;
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.2rem;
    padding: 0 0.25rem;
    gap: 0.5rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    color: #fff;
    font-size: 1.2rem;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    flex-shrink: 0;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  /* ---------- Rate pill ---------- */
  .rate-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0.5rem 0.85rem;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: 0.15s;
    font-family: inherit;
    box-shadow: var(--shadow-pill);
  }
  .rate-pill:hover { border-color: var(--accent); }
  .rate-pill:active { transform: scale(0.97); }
  .rate-pill .chev {
    font-size: 0.6rem;
    color: var(--text-mute);
    margin-top: 1px;
  }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.05rem;
    transition: 0.15s;
    font-family: inherit;
    padding: 0;
    box-shadow: var(--shadow-pill);
    line-height: 1;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .theme-toggle:active { transform: scale(0.94); }

  /* ---------- Rate dropdown ---------- */
  .rate-menu {
    position: absolute;
    top: 3.4rem;
    right: 0;
    background: var(--menu-bg);
    border-radius: 1rem;
    padding: 0.5rem;
    box-shadow: 0 15px 40px -10px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--border-soft);
    display: none;
    z-index: 20;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.35rem;
    width: 240px;
  }
  .rate-menu.open { display: grid; }

  .rate-option {
    padding: 0.6rem 0.4rem;
    border-radius: 0.6rem;
    border: none;
    background: var(--menu-option-bg);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--menu-option-text);
    cursor: pointer;
    transition: 0.12s;
    font-family: inherit;
  }
  .rate-option:hover {
    background: var(--menu-option-hover);
    color: var(--accent);
  }
  .rate-option.active {
    background: var(--menu-option-active-bg);
    color: var(--menu-option-active-text);
  }
  .rate-option.custom {
    grid-column: 1 / -1;
    background: #fef3c7;
    color: #92400e;
    border: 1px dashed #fcd34d;
  }
  .rate-option.custom:hover { background: #fde68a; color: #92400e; }

  /* ---------- Mode toggle ---------- */
  .mode-toggle {
    display: flex;
    background: var(--toggle-bg);
    border-radius: 1rem;
    padding: 4px;
    margin-bottom: 1.2rem;
    transition: background 0.3s ease;
  }
  .mode-btn {
    flex: 1;
    padding: 0.75rem 0.5rem;
    border: none;
    background: transparent;
    border-radius: 0.75rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    transition: 0.2s;
  }
  .mode-btn.active {
    background: var(--toggle-active);
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 1.5rem;
    padding: 1.4rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow-card);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  label {
    display: block;
    margin-bottom: 0.4rem;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ---------- Input ---------- */
  .input-wrapper {
    display: flex;
    align-items: center;
    padding: 0 0.9rem;
    background: var(--surface-soft);
    border: 2px solid var(--border);
    border-radius: 0.9rem;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }

  .input-wrapper:focus-within {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
  }

  .prefix {
    margin-right: 4px;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
  }

  input {
    flex: 1;
    width: 100%;
    padding: 0.85rem 0;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    min-width: 0;
  }

  input::placeholder { color: var(--text-mute); font-weight: 500; }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] { -moz-appearance: textfield; }

  /* ---------- Output ---------- */
  .output-card {
    padding: 1.8rem 1.5rem;
    color: var(--output-text);
    background: linear-gradient(135deg, var(--output-bg-1), var(--output-bg-2));
    border-radius: 1.5rem;
    box-shadow: 0 12px 30px -8px rgba(11, 30, 51, 0.5);
  }

  .out-label {
    margin-bottom: 0.4rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--output-label);
  }

  .out-value {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    font-size: 2.8rem;
    font-weight: 800;
    line-height: 1.1;
    word-break: break-word;
  }

  .out-value .cur {
    margin-right: 6px;
    font-size: 1.6rem;
    color: var(--output-currency);
  }

  /* ---------- Signature ---------- */
  .signature {
    margin-top: auto;
    padding: 0.5rem 0.75rem 0 0;
    text-align: right;
    font-family: "Brush Script MT", "Segoe Script", "Dancing Script", cursive;
    font-size: 1.15rem;
    font-style: italic;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    opacity: 0.75;
  }

  .signature::before {
    content: "— ";
    font-style: normal;
    color: var(--text-mute);
  }

  /* ---------- Custom rate modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--modal-overlay);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 1.5rem;
    padding: 1.6rem;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
  .modal h3 {
    margin: 0 0 0.3rem;
    font-size: 1.15rem;
    color: var(--text);
  }
  .modal p {
    margin: 0 0 1.2rem;
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .modal-input-wrap {
    display: flex;
    align-items: center;
    background: var(--surface-soft);
    border: 2px solid var(--border);
    border-radius: 0.9rem;
    padding: 0 0.9rem;
    margin-bottom: 1.2rem;
  }
  .modal-input-wrap:focus-within {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
  }
  .modal-suffix {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    margin-left: 4px;
  }
  .modal-actions {
    display: flex;
    gap: 0.6rem;
  }
  .modal-actions button {
    flex: 1;
    padding: 0.85rem;
    border-radius: 0.9rem;
    border: none;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
  }
  .modal-actions .cancel {
    background: var(--surface-soft);
    color: var(--text-dim);
  }
  .modal-actions .save {
    background: var(--text);
    color: var(--surface);
  }
  .modal-actions button:active { transform: scale(0.97); }
</style>
</head>

<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">💰</span>
        <span>Informal Blesser</span>
      </div>

      <div class="header-controls">
        <button class="rate-pill" id="ratePill" type="button">
          <span id="ratePillText">40%</span>
          <span class="chev">▼</span>
        </button>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <!-- Rate dropdown -->
    <div class="rate-menu" id="rateMenu">
      <button class="rate-option" data-rate="10" type="button">10%</button>
      <button class="rate-option" data-rate="20" type="button">20%</button>
      <button class="rate-option" data-rate="30" type="button">30%</button>
      <button class="rate-option" data-rate="40" type="button">40%</button>
      <button class="rate-option" data-rate="50" type="button">50%</button>
      <button class="rate-option" data-rate="60" type="button">60%</button>
      <button class="rate-option" data-rate="70" type="button">70%</button>
      <button class="rate-option" data-rate="80" type="button">80%</button>
      <button class="rate-option" data-rate="90" type="button">90%</button>
      <button class="rate-option" data-rate="100" type="button">100%</button>
      <button class="rate-option custom" id="customRateBtn" type="button">✎ Custom rate</button>
    </div>

    <!-- Mode toggle -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeLoanBtn" type="button">Loan → Repayment</button>
      <button class="mode-btn" id="modeRepayBtn" type="button">Repayment → Loan</button>
    </div>

    <!-- Input card -->
    <section class="card">
      <label for="inputAmount" id="inputLabel">Loan Amount (R)</label>
      <div class="input-wrapper">
        <span class="prefix" aria-hidden="true">R</span>
        <input
          id="inputAmount"
          type="number"
          inputmode="numeric"
          value="3300"
          step="50"
          min="0"
          max="100000000"
          placeholder="0"
        >
      </div>
    </section>

    <!-- Result card -->
    <section class="output-card" aria-live="polite">
      <div class="out-label" id="outputLabel">Total Repayment</div>
      <div class="out-value">
        <span class="cur" aria-hidden="true">R</span>
        <span id="outputValue">4620</span>
      </div>
    </section>

    <!-- Signature -->
    <div class="signature">Vuja Tsoaela</div>

  </div>

  <!-- Custom rate modal -->
  <div class="modal-overlay" id="customModal">
    <div class="modal">
      <h3>Custom rate</h3>
      <p>Enter any percentage between 1 and 500.</p>
      <div class="modal-input-wrap">
        <input type="number" id="customRateInput" min="1" max="500" step="1" placeholder="35" inputmode="numeric">
        <span class="modal-suffix">%</span>
      </div>
      <div class="modal-actions">
        <button class="cancel" id="cancelCustomBtn" type="button">Cancel</button>
        <button class="save" id="saveCustomBtn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    /* ---------- Storage keys ---------- */
    var KEY_RATE = "blesser_rate";
    var KEY_MODE = "blesser_mode";
    var KEY_THEME = "blesser_theme";

    /* ---------- Config ---------- */
    var MAX_AMOUNT = 1e8;

    /* ---------- State ---------- */
    var rate = loadNumber(KEY_RATE, 40);
    var mode = loadString(KEY_MODE, "loan");
    var theme = loadString(KEY_THEME, "light");

    /* ---------- DOM ---------- */
    var ratePill = document.getElementById("ratePill");
    var ratePillText = document.getElementById("ratePillText");
    var rateMenu = document.getElementById("rateMenu");
    var customRateBtn = document.getElementById("customRateBtn");
    var customModal = document.getElementById("customModal");
    var customRateInput = document.getElementById("customRateInput");
    var cancelCustomBtn = document.getElementById("cancelCustomBtn");
    var saveCustomBtn = document.getElementById("saveCustomBtn");
    var themeToggle = document.getElementById("themeToggle");

    var modeLoanBtn = document.getElementById("modeLoanBtn");
    var modeRepayBtn = document.getElementById("modeRepayBtn");
    var inputLabel = document.getElementById("inputLabel");
    var outputLabel = document.getElementById("outputLabel");
    var inputEl = document.getElementById("inputAmount");
    var outputEl = document.getElementById("outputValue");

    /* ---------- Helpers ---------- */

    function loadNumber(key, fallback) {
      try {
        var v = localStorage.getItem(key);
        if (v === null) return fallback;
        var n = parseFloat(v);
        return isFinite(n) ? n : fallback;
      } catch (e) { return fallback; }
    }

    function loadString(key, fallback) {
      try {
        var v = localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch (e) { return fallback; }
    }

    function save(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (e) {}
    }

    function safeParse(raw) {
      var n = parseFloat(raw);
      if (!isFinite(n) || isNaN(n) || n < 0) return 0;
      return Math.min(n, MAX_AMOUNT);
    }

    function formatWhole(n) {
      return Math.round(n).toString();
    }

    /* ---------- Theme ---------- */
    function applyTheme() {
      document.documentElement.setAttribute("data-theme", theme);
      themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0b1e33" : "#f8fafc");
    }

    function toggleTheme() {
      theme = theme === "dark" ? "light" : "dark";
      save(KEY_THEME, theme);
      applyTheme();
    }

    /* ---------- Rate UI ---------- */
    function updateRatePill() {
      ratePillText.textContent = rate + "%";
      var opts = rateMenu.querySelectorAll(".rate-option");
      opts.forEach(function (o) {
        var v = parseFloat(o.getAttribute("data-rate"));
        if (v === rate) o.classList.add("active");
        else o.classList.remove("active");
      });
    }

    function setRate(newRate) {
      rate = newRate;
      save(KEY_RATE, rate);
      updateRatePill();
      render();
    }

    function closeMenu() {
      rateMenu.classList.remove("open");
    }

    /* ---------- Mode UI ---------- */
    function updateModeUI() {
      if (mode === "loan") {
        modeLoanBtn.classList.add("active");
        modeRepayBtn.classList.remove("active");
        inputLabel.textContent = "Loan Amount (R)";
        outputLabel.textContent = "Total Repayment";
        inputEl.value = "3300";
      } else {
        modeRepayBtn.classList.add("active");
        modeLoanBtn.classList.remove("active");
        inputLabel.textContent = "Repayment Target (R)";
        outputLabel.textContent = "Loan to Give";
        inputEl.value = "10000";
      }
    }

    function setMode(newMode) {
      mode = newMode;
      save(KEY_MODE, mode);
      updateModeUI();
      render();
    }

    /* ---------- Calculation ---------- */
    function render() {
      var input = safeParse(inputEl.value);
      var multiplier = 1 + (rate / 100);
      var result;

      if (mode === "loan") {
        result = input * multiplier;
      } else {
        result = multiplier === 0 ? 0 : input / multiplier;
      }

      if (!isFinite(result)) result = 0;
      outputEl.textContent = formatWhole(result);
    }

    /* ---------- Events: theme ---------- */
    themeToggle.addEventListener("click", toggleTheme);

    /* ---------- Events: rate pill ---------- */
    ratePill.addEventListener("click", function (e) {
      e.stopPropagation();
      rateMenu.classList.toggle("open");
    });

    rateMenu.addEventListener("click", function (e) {
      e.stopPropagation();
    });

    Array.prototype.forEach.call(rateMenu.querySelectorAll(".rate-option:not(.custom)"), function (btn) {
      btn.addEventListener("click", function () {
        var v = parseFloat(btn.getAttribute("data-rate"));
        if (isFinite(v)) {
          setRate(v);
          closeMenu();
        }
      });
    });

    customRateBtn.addEventListener("click", function () {
      customRateInput.value = rate;
      customModal.classList.add("open");
      closeMenu();
      setTimeout(function () { customRateInput.focus(); }, 50);
    });

    cancelCustomBtn.addEventListener("click", function () {
      customModal.classList.remove("open");
    });

    saveCustomBtn.addEventListener("click", function () {
      var v = parseFloat(customRateInput.value);
      if (!isFinite(v) || v < 1) v = 1;
      if (v > 500) v = 500;
      setRate(v);
      customModal.classList.remove("open");
    });

    customRateInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") saveCustomBtn.click();
    });

    document.addEventListener("click", function () {
      closeMenu();
    });

    /* ---------- Events: mode toggle ---------- */
    modeLoanBtn.addEventListener("click", function () { setMode("loan"); });
    modeRepayBtn.addEventListener("click", function () { setMode("repay"); });

    /* ---------- Events: input ---------- */
    inputEl.addEventListener("input", render);

    /* ---------- Init ---------- */
    applyTheme();
    updateRatePill();
    updateModeUI();
    render();
  })();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
