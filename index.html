<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rand Converter</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.25), 0 2px 8px rgba(0, 0, 0, 0.05);
            padding: 2rem 2rem 2.2rem;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: 0.2s;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin: 0 0 2rem 0;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1e2f44;
            margin-bottom: 0.5rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            background: white;
            border: 2px solid #dbe1e9;
            border-radius: 1.2rem;
            padding: 0.2rem 0.2rem 0.2rem 1rem;
            transition: 0.2s;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.02);
        }
        .input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        .currency-symbol {
            font-weight: 600;
            font-size: 1.3rem;
            color: #3b82f6;
            margin-right: 4px;
        }
        input {
            border: none;
            outline: none;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 0.8rem 0.8rem 0.8rem 0.2rem;
            width: 100%;
            background: transparent;
            color: #0b1e33;
            letter-spacing: 0.5px;
        }
        input::placeholder {
            color: #a0b3c9;
            font-weight: 400;
            font-size: 1.2rem;
        }
        /* remove spinners */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .output-area {
            background: #0b1e33;
            border-radius: 1.5rem;
            padding: 1.6rem 1.8rem;
            margin: 0 0 0.5rem 0;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3), 0 10px 20px -8px rgba(0, 0, 0, 0.4);
            border: 1px solid #263b51;
        }
        .output-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            color: #8aa3c0;
            margin-bottom: 0.3rem;
        }
        .output-value {
            font-size: 3rem;
            font-weight: 700;
            color: #e6f0ff;
            line-height: 1.2;
            word-break: break-word;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .output-currency {
            font-size: 1.8rem;
            font-weight: 600;
            color: #3b82f6;
            margin-right: 6px;
        }
        .badge {
            background: #3b82f6;
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            letter-spacing: 0.3px;
            margin-left: 6px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            💵 Rand Converter
            <span class="badge">fixed rate</span>
        </h1>

        <!-- input field -->
        <div class="input-group">
            <label for="amountInput">Amount in Rand (R)</label>
            <div class="input-wrapper">
                <span class="currency-symbol">R</span>
                <input type="number" id="amountInput" value="3300" step="0.01" min="0" placeholder="0.00" autofocus>
            </div>
        </div>

        <!-- output display -->
        <div class="output-area">
            <div class="output-label">Calculated output</div>
            <div class="output-value">
                <span class="output-currency">R</span>
                <span id="outputValue">4620.00</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const input = document.getElementById('amountInput');
            const outputSpan = document.getElementById('outputValue');
            const MULTIPLIER = 1.4;

            function formatCurrency(value) {
                const num = typeof value === 'number' ? value : parseFloat(value);
                if (isNaN(num) || !isFinite(num)) return '0.00';
                return num.toLocaleString('en-ZA', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }

            function updateOutput() {
                let rawValue = input.value.trim();
                if (rawValue === '') {
                    outputSpan.textContent = formatCurrency(0);
                    return;
                }
                let amount = parseFloat(rawValue);
                if (isNaN(amount)) {
                    outputSpan.textContent = formatCurrency(0);
                    return;
                }
                if (amount < 0) amount = 0;
                const result = amount * MULTIPLIER;
                outputSpan.textContent = formatCurrency(result);
            }

            input.addEventListener('input', updateOutput);
            input.addEventListener('change', updateOutput);

            if (input.value === '' || input.value === undefined) {
                input.value = 3300;
            }
            updateOutput();
        })();
    </script>
</body>
</html>
